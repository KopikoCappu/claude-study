<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pot Odds Table</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#1C1C1E;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:0 0 2px}
.hint{font-size:13px;color:#555;margin:0 0 10px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:#fff;border:1px solid #e3e3e6;border-radius:10px;padding:6px 10px;font-size:13px}
.stat b{font-size:15px}
.table{background:radial-gradient(ellipse at center,#1f7a4d,#145c39);border:6px solid #5b3a1e;border-radius:40px;padding:14px 8px;text-align:center;color:#fff}
.lbl{font-size:12px;opacity:.85;margin:4px 0}
.row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0}
.card{width:52px;height:74px;background:#fff;border-radius:8px;color:#1C1C1E;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;line-height:1.05;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.card.red{color:#c8102e}
.card span{font-size:24px}
.chips{display:inline-block;background:rgba(0,0,0,.28);border-radius:20px;padding:6px 14px;margin:4px;font-size:14px}
.info{margin:10px 0;font-size:15px;text-align:center;background:#fff;border:1px solid #e3e3e6;border-radius:12px;padding:10px}
.btns{display:flex;gap:10px}
button{font:inherit;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;cursor:pointer;min-height:48px}
.btns button{flex:1}
#call{background:#0a7d4f;color:#fff}
#fold{background:#fff;color:#1C1C1E;border:1px solid #c9c9ce}
#next{background:#1C1C1E;color:#fff;width:100%;margin-top:10px}
button:disabled{opacity:.45}
.res{background:#fff;border:1px solid #e3e3e6;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.5}
.res h2{font-size:17px;margin:0 0 6px}
.ok{color:#0a7d4f}.bad{color:#c0392b}
.bar{position:relative;height:22px;background:#eee;border-radius:11px;margin:6px 0 2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:11px}
.eq{background:#0a7d4f;opacity:.85}.po{background:none;border-right:3px solid #c0392b;border-radius:0}
.legend{font-size:12px;color:#555}
.work{background:#f3f3f5;border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;margin:8px 0;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<h1>Pot Odds Table</h1>
<p class="hint">Look at your hand, the board and the bet. Then call or fold.</p>
<div class="stats">
<div class="stat">Score <b id="sc">0/0</b></div>
<div class="stat">Streak <b id="st">0</b></div>
<div class="stat">Level <b id="lv">1</b></div>
<div class="stat">Total EV <b id="tev">$0</b></div>
</div>
<div class="table">
<div class="lbl">Villain bets</div>
<div class="row"><span class="chips" id="bet"></span></div>
<div class="lbl" id="street"></div>
<div class="row" id="board"></div>
<div><span class="chips" id="pot"></span></div>
<div class="lbl">Your hand</div>
<div class="row" id="hand"></div>
</div>
<div class="info" id="info"></div>
<div class="btns"><button id="call"></button><button id="fold">Fold</button></div>
<div id="out" class="res hidden"></div>
<button id="next" class="hidden">Next hand</button>

<script>
const SU=['♠','♥','♦','♣'],RN={11:'J',12:'Q',13:'K',14:'A'};
const rl=r=>RN[r]||String(r);
let score=0,total=0,streak=0,evSum=0,cur=null,answered=false;
const $=id=>document.getElementById(id);

function deck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makes(hero,board,extra){
  const all=hero.concat(board,extra?[extra]:[]);
  // flush using hero suit
  for(const s of new Set(hero.map(c=>c.s))){
    if(all.filter(c=>c.s===s).length>=5&&hero.some(c=>c.s===s))return 'flush';
  }
  const rs=new Set(all.map(c=>c.r));if(rs.has(14))rs.add(1);
  const hr=new Set(hero.map(c=>c.r));if(hr.has(14))hr.add(1);
  for(let lo=1;lo<=10;lo++){
    let ok=true,hh=false;
    for(let k=0;k<5;k++){if(!rs.has(lo+k)){ok=false;break}if(hr.has(lo+k))hh=true}
    if(ok&&hh)return 'straight';
  }
  return null;
}
function level(){return Math.min(4,1+Math.floor(score/3))}
function countOuts(hero,board){
  const used=hero.concat(board);
  return deck().filter(c=>!used.some(u=>u.r===c.r&&u.s===c.s)&&makes(hero,board,c)).length;
}
function deal(){
  const L=level(),margin=[0,10,6,3,2][L];
  const turn=L>=3&&Math.random()<.5;
  for(let t=0;t<20000;t++){
    const d=shuffle(deck());
    const hero=d.slice(0,2),board=d.slice(2,turn?6:5);
    if(new Set(hero.concat(board).map(c=>c.r)).size<hero.length+board.length)continue;
    if(makes(hero,board))continue;
    const outs=countOuts(hero,board);
    if(outs<4)continue;
    const pots=[40,60,80,100,120,200],fr=[.25,.33,.5,.66,.75,1,1.5];
    const pot=pots[Math.floor(Math.random()*pots.length)];
    const bet=Math.max(5,Math.round(pot*fr[Math.floor(Math.random()*fr.length)]/5)*5);
    const m=build(hero,board,outs,pot,bet,turn);
    if(Math.abs(m.eq-m.odds)*100<margin||Math.abs(m.exact-m.odds)*100<margin||(m.eq>m.odds)!==(m.exact>m.odds))continue;
    return m;
  }
  return build([{r:14,s:1},{r:13,s:1}],[{r:12,s:1},{r:7,s:1},{r:2,s:3}],9,60,20,false);
}
function build(hero,board,outs,pot,bet,turn){
  const mult=turn?2:4,eq=outs*mult/100;
  const unseen=turn?46:47;
  const exact=turn?outs/46:1-((unseen-outs)*(unseen-outs-1))/(unseen*(unseen-1));
  const potAfter=pot+bet,odds=bet/(potAfter+bet);
  const ev=eq*potAfter-(1-eq)*bet;
  return {hero,board,outs,pot,bet,turn,mult,eq,exact,potAfter,odds,ev};
}
function cardEl(c){
  const d=document.createElement('div');d.className='card'+(c.s===1||c.s===2?' red':'');
  d.innerHTML=rl(c.r)+'<span>'+SU[c.s]+'</span>';return d;
}
function show(){
  const m=cur;answered=false;
  $('hand').replaceChildren(...m.hero.map(cardEl));
  $('board').replaceChildren(...m.board.map(cardEl));
  $('street').textContent=m.turn?'Turn (one card to come)':'Flop (turn and river to come)';
  $('pot').textContent='Pot before bet: $'+m.pot;
  $('bet').textContent='Bet: $'+m.bet;
  $('info').innerHTML='Pot is <b>$'+m.pot+'</b>, villain bets <b>$'+m.bet+'</b>. Call <b>$'+m.bet+'</b> to win <b>$'+m.potAfter+'</b>. Do you have the odds?';
  $('call').textContent='Call $'+m.bet;
  $('call').disabled=$('fold').disabled=false;
  $('out').classList.add('hidden');$('next').classList.add('hidden');
  $('lv').textContent=level();
}
const pct=x=>(x*100).toFixed(1).replace(/\.0$/,'')+'%';
const money=x=>(x<0?'-$':'$')+Math.abs(x).toFixed(2);
function answer(call){
  if(answered)return;answered=true;
  const m=cur,shouldCall=m.eq>m.odds;
  const right=call===shouldCall;
  total++;if(right){score++;streak++}else streak=0;
  const realEV=call?m.ev:0;evSum+=realEV;
  $('call').disabled=$('fold').disabled=true;
  $('sc').textContent=score+'/'+total;$('st').textContent=streak;$('lv').textContent=level();
  $('tev').textContent=money(evSum);
  const o=$('out');
  o.innerHTML=
   '<h2 class="'+(right?'ok':'bad')+'">'+(right?'Correct':'Not quite')+': '+(shouldCall?'call':'fold')+' is right</h2>'+
   '<div class="work">Outs: '+m.outs+' (straight/flush cards only)<br>'+
   'Equity ≈ '+m.outs+' × '+m.mult+' = '+m.outs*m.mult+'% (rule of '+m.mult+')<br>'+
   'Pot odds = '+m.bet+' / ('+m.potAfter+' + '+m.bet+') = '+pct(m.odds)+'<br>'+
   'EV(call) = '+m.eq.toFixed(2)+' × '+m.potAfter+' − '+(1-m.eq).toFixed(2)+' × '+m.bet+' = '+money(m.ev)+'<br>'+
   'EV(fold) = $0.00</div>'+
   '<div class="bar"><i class="eq" style="width:'+Math.min(100,m.eq*100)+'%"></i><i class="po" style="width:'+m.odds*100+'%"></i></div>'+
   '<div class="legend">Green = your equity ('+pct(m.eq)+'). Red line = pot odds needed ('+pct(m.odds)+').</div>'+
   '<p>'+(shouldCall?'Equity beats the price, so calling has positive EV ('+money(m.ev)+').':'Equity is below the price, so calling loses '+money(-m.ev)+' on average. Folding is better.')+
   (call!==shouldCall?' You '+(call?'called':'folded')+', which cost you '+money(Math.abs(m.ev))+' of EV.':'')+'</p>'+
   '<p class="legend">Exact chance to hit '+(m.turn?'on the river':'by the river')+': '+pct(m.exact)+'. The rule of '+m.mult+' is a close shortcut. Overcards and pair outs are ignored here.</p>';
  o.classList.remove('hidden');$('next').classList.remove('hidden');
  o.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('call').onclick=()=>answer(true);
$('fold').onclick=()=>answer(false);
$('next').onclick=()=>{cur=deal();show();window.scrollTo(0,0)};
cur=build([{r:14,s:1},{r:13,s:1}],[{r:12,s:1},{r:7,s:1},{r:2,s:3}],9,60,20,false);
show();
</script>
</body>
</html>
